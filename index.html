<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Affairs</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 10px; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; }
        h1 { color: #006a4e; }
    </style>
</head>
<body>
    <h1>🇧🇩 State Affairs</h1>
    <div id="news"></div>
    <script>
        fetch('https://https://state-affairs.onrender.com/api/news')
          .then(res => res.json())
          .then(data => {
              let html = '';
              data.data.forEach(item => {
                  html += `<div class="card"><h3>${item.title}</h3><p>${item.rewritten_content}</p><small>সূত্র: ${item.source}</small></div>`;
              });
              document.getElementById('news').innerHTML = html;
          });
    </script>
</body>
</html>
