<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Affairs</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 10px; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #006a4e; text-align: center; }
        .error { color: red; text-align: center; }
        .loading { text-align: center; color: #555; }
    </style>
</head>
<body>
    <h1>State Affairs</h1>
    <div id="news" class="loading">⏳ খবর লোড হচ্ছে...</div>

    <script>
        // আপনার Render URL বসান (হুবহু নিচের লাইনে)
        const API_URL = 'https://state-affairs.onrender.com/api/news'; 

        fetch(API_URL)
          .then(res => {
              if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
              return res.json();
          })
          .then(data => {
              const container = document.getElementById('news');
              if (data.status === 'success' && data.data && data.data.length > 0) {
                  let html = '';
                  data.data.forEach(item => {
                      html += `<div class="card">
                                  <h3>${item.title || 'শিরোনাম নেই'}</h3>
                                  <p>${item.rewritten_content || item.original_content || 'বিস্তারিত নেই'}</p>
                                  <small>📰 সূত্র: ${item.source || 'অজানা'} | 🕐 ${new Date(item.published_at).toLocaleString('bn-BD')}</small>
                              </div>`;
                  });
                  container.innerHTML = html;
              } else {
                  container.innerHTML = '<p class="error">😔 কোনো খবর পাওয়া যায়নি। প্রথমে GitHub Actions রান করুন অথবা Supabase চেক করুন।</p>';
              }
          })
          .catch(error => {
              document.getElementById('news').innerHTML = `<p class="error">❌ সংযোগ সমস্যা! Render API চালু আছে কিনা চেক করুন।<br><small>${error.message}</small></p>`;
              console.error('Fetch Error:', error);
          });
    </script>
</body>
</html>
